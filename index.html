<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Qcz.a</title>

<style>

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;

    font-family: Arial, sans-serif;
    color: white;

    background: linear-gradient(
        135deg,
        #ff0080,
        #7928ca,
        #2b0aff
    );
}

.card {
    width: 85%;
    max-width: 380px;

    padding: 40px 25px;

    text-align: center;

    background: rgba(0, 0, 0, 0.45);

    border-radius: 25px;

    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}

.avatar {
    width: 110px;
    height: 110px;

    margin: 0 auto 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: linear-gradient(
        135deg,
        #ff0080,
        #7928ca,
        #00d4ff
    );

    font-size: 45px;
    font-weight: bold;
}

h1 {
    margin: 10px 0;
    font-size: 40px;
}

p {
    margin-bottom: 25px;
    font-size: 18px;
}

a {
    display: block;

    padding: 16px;

    border-radius: 15px;

    background: white;
    color: black;

    text-decoration: none;

    font-size: 18px;
    font-weight: bold;
}

a:hover {
    transform: scale(1.03);
}

</style>
</head>

<body>

<div class="card">

    <div class="avatar">
        Q
    </div>

    <h1>Qcz.a</h1>

    <p>حط فولو يعسل 🍯</p>

    <a href="https://x.com/qczaa" target="_blank">
        𝕏 Twitter
    </a>

</div>

</body>
</html>
