* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, Tahoma, sans-serif;
  color: white;
  overflow: hidden;
  background: #07070d;
}

body::before,
body::after {
  content: "";
  position: fixed;
  width: 420px;
  height: 420px;
  border-radius: 50%;
  filter: blur(80px);
  opacity: .55;
  z-index: -2;
  animation: float 7s ease-in-out infinite alternate;
}

body::before {
  background: #ff2d8d;
  top: -130px;
  right: -100px;
}

body::after {
  background: #6c35ff;
  bottom: -160px;
  left: -100px;
  animation-delay: -3s;
}

.bg {
  position: fixed;
  inset: 0;
  z-index: -3;

    linear-gradient(135deg,#090912,#11101f 50%,#080811);
}
